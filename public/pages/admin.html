<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Panel — Nirvana</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root { --green:#2d6a4f; --green-light:#52b788; --green-pale:#d8f3dc; --dark:#1a2e1e; --cream:#f8f4ee; --gold:#c9a84c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:#f0f4f1; min-height:100vh; }
  .topbar { background:var(--dark); padding:1rem 2rem; display:flex; align-items:center; justify-content:space-between; }
  .logo { font-family:'Playfair Display',serif; font-size:1.4rem; color:white; font-weight:900; text-decoration:none; }
  .logo span { color:var(--gold); }
  .admin-badge { background:var(--gold); color:var(--dark); padding:0.25rem 0.8rem; border-radius:50px; font-size:0.75rem; font-weight:700; margin-left:0.8rem; }
  .topbar-right { display:flex; gap:1.5rem; align-items:center; }
  .topbar-right a { color:rgba(255,255,255,0.6); text-decoration:none; font-size:0.85rem; }

  .container { max-width:1100px; margin:2.5rem auto; padding:0 1.5rem; }
  h1 { font-family:'Playfair Display',serif; font-size:2rem; color:var(--dark); }
  .subtitle { color:#6b7c6c; margin:0.3rem 0 2rem; font-size:0.9rem; }

  .tabs { display:flex; gap:0.5rem; margin-bottom:2rem; }
  .tab {
    padding:0.6rem 1.5rem; border-radius:50px; font-size:0.88rem; font-weight:600;
    cursor:pointer; border:2px solid #e0e8e1; background:white; font-family:'DM Sans',sans-serif;
    color:#6b7c6c; transition:all 0.2s;
  }
  .tab.active { background:var(--green); color:white; border-color:var(--green); }

  .card { background:white; border-radius:16px; padding:1.5rem; }
  table { width:100%; border-collapse:collapse; font-size:0.85rem; }
  th { text-align:left; padding:0.6rem 0.8rem; color:#6b7c6c; font-weight:600; font-size:0.78rem; text-transform:uppercase; border-bottom:2px solid #f0f4f1; }
  td { padding:0.8rem; border-bottom:1px solid #f5f7f5; vertical-align:middle; }
  tr:last-child td { border:none; }
  .badge { display:inline-block; padding:0.2rem 0.6rem; border-radius:50px; font-size:0.72rem; font-weight:600; }
  .badge.pending { background:#fff3cd; color:#b8860b; }
  .badge.confirmed { background:#d4edda; color:#155724; }
  .badge.collected { background:var(--green-pale); color:var(--green); }
  .badge.cancelled { background:#f8d7da; color:#721c24; }
  .btn-sm { padding:0.35rem 0.8rem; border-radius:6px; font-size:0.78rem; font-weight:600; cursor:pointer; border:none; font-family:'DM Sans',sans-serif; transition:all 0.2s; }
  .btn-collect { background:var(--green); color:white; }
  .btn-collect:hover { background:var(--dark); }
  .filter-row { display:flex; gap:0.8rem; margin-bottom:1.2rem; flex-wrap:wrap; }
  .filter-btn { padding:0.5rem 1.1rem; border-radius:50px; font-size:0.82rem; font-weight:600; cursor:pointer; border:2px solid #e0e8e1; background:white; font-family:'DM Sans',sans-serif; color:#6b7c6c; }
  .filter-btn.active { background:var(--green-pale); border-color:var(--green); color:var(--green); }
  .stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1rem; margin-bottom:2rem; }
  .mini-stat { background:white; border-radius:12px; padding:1.2rem; border-left:3px solid var(--green-light); }
  .mini-stat .n { font-family:'Playfair Display',serif; font-size:1.8rem; font-weight:700; color:var(--dark); }
  .mini-stat .l { font-size:0.78rem; color:#6b7c6c; margin-top:0.2rem; }
  .empty { text-align:center; padding:3rem; color:#6b7c6c; }
  .section { display:none; }
  .section.active { display:block; }

  .toast { position:fixed; bottom:2rem; right:2rem; background:var(--green); color:white; padding:1rem 1.5rem; border-radius:12px; font-size:0.88rem; display:none; z-index:999; box-shadow:0 8px 24px rgba(0,0,0,0.15); }
</style>
</head>
<body>
<div class="topbar">
  <div style="display:flex;align-items:center;">
    <a href="/" class="logo">Nirv<span>ana</span></a>
    <span class="admin-badge">ADMIN</span>
  </div>
  <div class="topbar-right">
    <a href="/dashboard">User View</a>
    <a href="#" onclick="logout()">Sign out</a>
  </div>
</div>

<div class="container">
  <h1>Admin Dashboard</h1>
  <p class="subtitle">Manage all pickups, mark collections, and oversee the platform.</p>

  <div class="stats-row">
    <div class="mini-stat"><div class="n" id="adTotalPickups">—</div><div class="l">Total Pickups</div></div>
    <div class="mini-stat"><div class="n" id="adPending">—</div><div class="l">Pending</div></div>
    <div class="mini-stat"><div class="n" id="adCollected">—</div><div class="l">Collected</div></div>
    <div class="mini-stat"><div class="n" id="adTotalKg">—</div><div class="l">Total KG Collected</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('pickups')">All Pickups</button>
  </div>

  <div id="tabPickups" class="section active">
    <div class="filter-row">
      <button class="filter-btn active" onclick="filterPickups('all', this)">All</button>
      <button class="filter-btn" onclick="filterPickups('pending', this)">Pending</button>
      <button class="filter-btn" onclick="filterPickups('confirmed', this)">Confirmed</button>
      <button class="filter-btn" onclick="filterPickups('collected', this)">Collected</button>
      <button class="filter-btn" onclick="filterPickups('cancelled', this)">Cancelled</button>
    </div>
    <div class="card">
      <div id="adminPickupsTable"><div class="empty">Loading...</div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const token = localStorage.getItem('nirvana_token');
const user = JSON.parse(localStorage.getItem('nirvana_user') || '{}');
if (!token || user.role !== 'admin') {
  alert('Admin access required');
  window.location.href = '/login';
}

let allPickups = [];
let currentFilter = 'all';

function logout() { localStorage.clear(); window.location.href = '/login'; }
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
}

async function loadAllPickups() {
  try {
    const res = await fetch('/api/pickups/admin/all', { headers:{ Authorization:'Bearer '+token } });
    const data = await res.json();
    if (!data.success) { alert('Not authorized'); return; }
    allPickups = data.pickups;
    updateStats();
    renderTable(allPickups);
  } catch(e) { console.error(e); }
}

function updateStats() {
  document.getElementById('adTotalPickups').textContent = allPickups.length;
  document.getElementById('adPending').textContent = allPickups.filter(p => p.status === 'pending').length;
  document.getElementById('adCollected').textContent = allPickups.filter(p => p.status === 'collected').length;
  const totalKg = allPickups.filter(p => p.status === 'collected').reduce((sum, p) => sum + p.quantity, 0);
  document.getElementById('adTotalKg').textContent = totalKg.toFixed(1) + ' kg';
}

function filterPickups(status, btn) {
  currentFilter = status;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const filtered = status === 'all' ? allPickups : allPickups.filter(p => p.status === status);
  renderTable(filtered);
}

const matIcons = { plastic:'🧴', paper:'📄', metal:'🔩', glass:'🫙', electronics:'📱', cardboard:'📦', rubber:'⚫', textile:'👕' };

function renderTable(pickups) {
  const container = document.getElementById('adminPickupsTable');
  if (!pickups.length) { container.innerHTML = '<div class="empty">No pickups found.</div>'; return; }
  const rows = pickups.map(p => `
    <tr>
      <td><strong>${p.user?.name || '—'}</strong><br><span style="color:#6b7c6c;font-size:0.78rem;">${p.user?.phone || p.user?.email || ''}</span></td>
      <td>${matIcons[p.materialType] || '♻️'} ${p.materialType}</td>
      <td>${p.quantity} kg</td>
      <td>${new Date(p.scheduledDate).toLocaleDateString('en-IN')}<br><span style="color:#6b7c6c;font-size:0.78rem;">${p.timeSlot}</span></td>
      <td style="max-width:150px;font-size:0.82rem;">${p.address}, ${p.city}</td>
      <td><span class="badge ${p.status}">${p.status}</span></td>
      <td>+${p.pointsEarned} pts / ₹${p.cashEarned}</td>
      <td>
        ${p.status === 'pending' || p.status === 'confirmed'
          ? `<button class="btn-sm btn-collect" onclick="markCollected('${p._id}')">✓ Mark Collected</button>`
          : '—'
        }
      </td>
    </tr>
  `).join('');
  container.innerHTML = `<table><thead><tr><th>User</th><th>Material</th><th>Qty</th><th>Date</th><th>Address</th><th>Status</th><th>Reward</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function markCollected(id) {
  if (!confirm('Mark this pickup as collected? Rewards will be credited to the user.')) return;
  try {
    const res = await fetch(`/api/pickups/${id}/collect`, {
      method:'PUT', headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+token },
      body: JSON.stringify({ notes: 'Collected by admin' })
    });
    const data = await res.json();
    if (data.success) {
      showToast('✅ ' + data.message);
      loadAllPickups();
    } else showToast('❌ ' + data.message);
  } catch(e) { showToast('Error occurred'); }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

// Add /admin route to server
loadAllPickups();
</script>
</body>
</html>
