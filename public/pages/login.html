<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — Nirvana</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root { --green:#2d6a4f; --green-light:#52b788; --green-pale:#d8f3dc; --dark:#1a2e1e; --cream:#f8f4ee; --gold:#c9a84c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--cream); min-height:100vh; display:flex; }
  .left-panel {
    flex:1; background:linear-gradient(145deg, var(--dark) 0%, var(--green) 100%);
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    padding:4rem; color:white; position:relative; overflow:hidden;
  }
  .left-panel::before {
    content:''; position:absolute; width:400px; height:400px;
    border-radius:50%; background:rgba(82,183,136,0.1);
    top:-100px; right:-100px;
  }
  .left-panel::after {
    content:''; position:absolute; width:300px; height:300px;
    border-radius:50%; background:rgba(201,168,76,0.08);
    bottom:-50px; left:-50px;
  }
  .left-panel h1 { font-family:'Playfair Display',serif; font-size:3.5rem; font-weight:900; margin-bottom:1rem; position:relative; z-index:1; }
  .left-panel h1 span { color:var(--gold); }
  .left-panel p { color:rgba(255,255,255,0.7); font-size:1.05rem; line-height:1.7; max-width:350px; text-align:center; position:relative; z-index:1; }
  .leaf-bg { position:absolute; font-size:8rem; opacity:0.05; bottom:2rem; right:2rem; z-index:0; }

  .right-panel { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:4rem; }
  .form-box { width:100%; max-width:420px; }
  .form-box h2 { font-family:'Playfair Display',serif; font-size:2rem; color:var(--dark); margin-bottom:0.4rem; }
  .form-box p { color:#6b7c6c; font-size:0.95rem; margin-bottom:2.5rem; }
  .form-group { margin-bottom:1.3rem; }
  label { display:block; font-size:0.85rem; font-weight:600; color:var(--dark); margin-bottom:0.5rem; }
  input {
    width:100%; padding:0.85rem 1rem; border-radius:10px;
    border:2px solid #e0e8e1; background:white;
    font-family:'DM Sans',sans-serif; font-size:0.95rem;
    transition:border-color 0.2s, box-shadow 0.2s; outline:none;
  }
  input:focus { border-color:var(--green); box-shadow:0 0 0 4px rgba(45,106,79,0.08); }
  .btn {
    width:100%; padding:1rem; background:var(--green); color:white;
    border:none; border-radius:10px; font-family:'DM Sans',sans-serif;
    font-size:1rem; font-weight:600; cursor:pointer;
    transition:background 0.2s, transform 0.2s;
    margin-top:0.5rem;
  }
  .btn:hover { background:var(--dark); transform:translateY(-1px); }
  .btn:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
  .switch { text-align:center; margin-top:1.5rem; font-size:0.9rem; color:#6b7c6c; }
  .switch a { color:var(--green); text-decoration:none; font-weight:600; }
  .msg { padding:0.8rem 1rem; border-radius:8px; margin-bottom:1rem; font-size:0.9rem; display:none; }
  .msg.error { background:#fde8e8; color:#c0392b; }
  .msg.success { background:var(--green-pale); color:var(--green); }
  .back-link { position:fixed; top:1.5rem; left:1.5rem; text-decoration:none; color:white; font-size:0.9rem; font-weight:500; display:flex; align-items:center; gap:0.4rem; }
  @media(max-width:768px) { .left-panel{display:none;} .right-panel{padding:3rem 1.5rem;} }
</style>
</head>
<body>
<a href="/" class="back-link">← Home</a>
<div class="left-panel">
  <div class="leaf-bg">🌿</div>
  <h1>Nirv<span>ana</span></h1>
  <p>Segregate Today, Sustain Tomorrow.<br/>Join thousands of Indians making recycling a habit.</p>
</div>
<div class="right-panel">
  <div class="form-box">
    <h2>Welcome back</h2>
    <p>Sign in to your Nirvana account</p>
    <div class="msg" id="msg"></div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="you@example.com"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••"/>
    </div>
    <button class="btn" id="loginBtn" onclick="handleLogin()">Sign In</button>
    <div class="switch">Don't have an account? <a href="/register">Register here</a></div>
  </div>
</div>
<script>
async function handleLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('msg');

  if (!email || !password) { showMsg('Please fill in all fields', 'error'); return; }

  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    const res = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem('nirvana_token', data.token);
      localStorage.setItem('nirvana_user', JSON.stringify(data.user));
      showMsg('Login successful! Redirecting...', 'success');
      setTimeout(() => window.location.href = '/dashboard', 1000);
    } else {
      showMsg(data.message || 'Login failed', 'error');
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  } catch(e) {
    showMsg('Server error. Please try again.', 'error');
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}
function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text; el.className = 'msg ' + type;
  el.style.display = 'block';
}
document.addEventListener('keydown', e => { if(e.key==='Enter') handleLogin(); });
</script>
</body>
</html>
